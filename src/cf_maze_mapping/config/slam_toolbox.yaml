slam_toolbox:
  ros__parameters:

    # ==========================================
    # CONFIGURACION GENERAL
    # ==========================================

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    mode: mapping

    # ==========================================
    # FRAMES - PLACEHOLDERS
    # ==========================================

    map_frame: map
    odom_frame: placeholder_odom
    base_frame: placeholder_base_link

    # ==========================================
    # TOPICOS - PLACEHOLDERS
    # ==========================================

    scan_topic: /placeholder/scan

    # ==========================================
    # CONFIGURACION DEL MAPA
    # ==========================================

    resolution: 0.05
    map_update_interval: 1.0

    use_map_saver: true

    # ==========================================
    # CONFIGURACION DE SENSORES
    # ==========================================

    min_laser_range: 0.06
    max_laser_range: 3.5

    throttle_scans: 1

    # ==========================================
    # PROCESAMIENTO
    # ==========================================

    minimum_time_interval: 0.1

    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.05

    # Multi-ranger: solo cuatro sensores horizontales
    use_scan_matching: false
    do_loop_closing: false

    # ==========================================
    # TRANSFORMACIONES
    # ==========================================

    transform_publish_period: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # ==========================================
    # OTROS
    # ==========================================

    scan_buffer_size: 10
    stack_size_to_use: 40000000